name: Build Android APK

on:
  push:
    paths:
      - 'docs/app/**'
      - 'assets/**'
      - 'capacitor.config.json'
      - 'package.json'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Capacitor
        run: npm install

      - name: Create Android project
        run: npx cap add android

      - name: Generate app icons and splash
        continue-on-error: true
        run: npx --yes @capacitor/assets@3.0.5 generate --android

      - name: Copy web app into Android project
        run: npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Collect APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk BUHAY.apk

      - uses: actions/upload-artifact@v4
        with:
          name: BUHAY-apk
          path: BUHAY.apk

      - name: Publish to the apk-latest release (download link used by the website)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk-latest --yes --cleanup-tag || true
          gh release create apk-latest BUHAY.apk \
            --title "BUHAY for Android (latest build)" \
            --notes "Installable Android package of the BUHAY app, built from commit ${GITHUB_SHA::7}. Allow installs from your browser when prompted." \
            --target "$GITHUB_SHA"
